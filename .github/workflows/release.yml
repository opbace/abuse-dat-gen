name: Release

on:
  schedule:
    # Daily. Off the hour to avoid GitHub's top-of-hour scheduling backlog.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Branch served through raw.githubusercontent.com; the primary download.
  RELEASE_BRANCH: release
  # Older GitHub releases (archives, including the .txt lists) are deleted after
  # each successful publish.
  KEEP_RELEASES: 14

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            compat/go.sum

      - name: Test
        run: go test ./...

      # Any failed quality gate exits non-zero here, so nothing below runs and
      # the previous build stays published.
      - name: Build
        run: |
          go run ./cmd/abuse-dat-gen \
            -out dist \
            -release-notes release-notes.md \
            -version "${GITHUB_SHA::12}" \
            -previous-manifest "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${RELEASE_BRANCH}/manifest.json"

      - name: Verify with Xray
        working-directory: compat
        env:
          ABUSE_DAT_DIR: ../dist
        run: go test -v -timeout 30m -run 'TestGolden|TestRelease' ./...

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check --strict sha256sums.txt

      - name: Attach license and notices
        run: |
          cp LICENSE NOTICE.md DISCLAIMER.md dist/

      - name: Choose tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"

      # raw.githubusercontent.com serves files from a branch, not from release
      # assets. The branch is a single orphan commit replaced on every build,
      # so the repository does not keep ~70 MB of history per day.
      # The .txt lists stay in the GitHub release only.
      - name: Publish to the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          mkdir branch
          cp dist/*.dat dist/manifest.json dist/sha256sums.txt \
             dist/LICENSE dist/NOTICE.md dist/DISCLAIMER.md branch/
          cd branch
          git init -q -b "$RELEASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build $TAG"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${RELEASE_BRANCH}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --latest

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 500 --json tagName,createdAt \
            --jq "sort_by(.createdAt) | reverse | .[${KEEP_RELEASES}:] | .[].tagName" |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
