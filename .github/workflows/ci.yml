name: CI

on:
  push:
    branches-ignore:
      # Generated files only; pushed by the release workflow.
      - release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            compat/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Xray compatibility (golden file)
        working-directory: compat
        run: |
          go vet ./...
          go test -v -run TestGolden ./...
